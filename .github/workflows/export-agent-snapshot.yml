name: Export agent snapshot

on:
  push:
    branches:
      - agent/fix-settings-bootstrap
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create repair and merge snapshots
        shell: bash
        run: |
          set -euo pipefail
          merge_sha=6a0b30788d55e45253a5a3b350b2cefaa469cd47
          read -r parent_one parent_two <<< "$(git show -s --format='%P' "$merge_sha")"
          merge_base="$(git merge-base "$parent_one" "$parent_two")"
          printf 'merge=%s\nparent_one=%s\nparent_two=%s\nmerge_base=%s\n' "$merge_sha" "$parent_one" "$parent_two" "$merge_base" > snapshot-refs.txt
          git archive --format=zip --output=nemolore-source.zip HEAD
          git archive --format=zip --output=nemolore-parent-one.zip "$parent_one"
          git archive --format=zip --output=nemolore-parent-two.zip "$parent_two"
          git archive --format=zip --output=nemolore-merge-base.zip "$merge_base"

      - name: Upload repository snapshots
        uses: actions/upload-artifact@v4
        with:
          name: nemolore-merge-snapshots
          path: |
            nemolore-source.zip
            nemolore-parent-one.zip
            nemolore-parent-two.zip
            nemolore-merge-base.zip
            snapshot-refs.txt
          if-no-files-found: error
          retention-days: 1
